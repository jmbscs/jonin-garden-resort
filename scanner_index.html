<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jo-Nin QR Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f1b14; color: white; min-height: 100vh; }
    .header { background: #1B6B3A; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    .scanner-wrap { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 20px; }
    #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #1B6B3A; background: #000; }
    #reader * { border-radius: 0 !important; }
    #status-text { font-size: 14px; color: #9bbfa8; text-align: center; }
    #result-card { display: none; width: 100%; max-width: 400px; border-radius: 12px; padding: 24px; text-align: center; }
    #result-card.time-in { background: #1B6B3A; }
    #result-card.time-out { background: #1a4a8a; }
    #result-card.error { background: #8a1a1a; }
    .action-badge { display: inline-block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.15); margin-bottom: 12px; }
    #result-card h2 { font-size: 22px; margin-bottom: 4px; }
    #result-card p { font-size: 13px; opacity: 0.8; margin: 4px 0; }
    .duration { font-size: 28px; font-weight: bold; color: #F5C842; margin: 12px 0; }
    #result-card button { margin-top: 16px; padding: 10px 28px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .manual-input { width: 100%; max-width: 400px; display: flex; gap: 8px; }
    .manual-input input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #2e8f56; background: #1a2e1f; color: white; font-size: 14px; }
    .manual-input button { padding: 10px 16px; background: #1B6B3A; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .access-denied { text-align: center; padding: 60px 20px; }
    .access-denied h2 { color: #F5C842; margin-bottom: 12px; }
    #reader__scan_region img { display: none; }
  </style>
</head>
<body>
<div class="header">
  <h1>🌿 Jo-Nin QR Scanner</h1>
  <div class="header-right">
    <span id="clock"></span>
    <a href="admindashboard_index.html" class="back-btn">← Dashboard</a>
  </div>
</div>
<div id="access-denied" class="access-denied" style="display:none">
  <h2>🔒 Access Denied</h2>
  <p>This page is for authorized staff only.</p><br>
  <a href="homepage_index.html" class="back-btn">Go to Homepage</a>
</div>
<div id="scanner-content">
  <div class="scanner-wrap">
    <div id="reader"></div>
    <p id="status-text">Starting camera...</p>
    <div id="result-card">
      <div class="action-badge" id="res-badge"></div>
      <h2 id="res-name"></h2>
      <p id="res-ref"></p>
      <p id="res-time"></p>
      <div class="duration" id="res-duration"></div>
      <button onclick="resetScanner()">Scan Next Guest</button>
    </div>
    <div class="manual-input">
      <input type="text" id="manual-ref" placeholder="Or type booking ref manually..." />
      <button onclick="processManual()">Go</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  (function() {
    const user = JSON.parse(localStorage.getItem('joNinCurrentUser') || 'null');
    if (!user || user.role !== 'admin') {
      document.getElementById('scanner-content').style.display = 'none';
      document.getElementById('access-denied').style.display = 'block';
    }
  })();

  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-PH');
  }, 1000);

  const statusEl = document.getElementById('status-text');
  let lastScanned = '';
  let scanner = null;

  function startScanner() {
    scanner = new Html5Qrcode('reader');
    Html5Qrcode.getCameras().then(cameras => {
      if (!cameras || cameras.length === 0) {
        statusEl.textContent = 'No camera found — use manual input below';
        return;
      }
      // Prefer back camera
      const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
      scanner.start(
        backCam.id,
        { fps: 15, qrbox: { width: 280, height: 280 } },
        (decodedText) => {
          if (decodedText === lastScanned) return;
          lastScanned = decodedText;
          scanner.pause();
          statusEl.textContent = 'QR detected! Processing...';
          processScan(decodedText);
        },
        () => {}
      ).then(() => {
        statusEl.textContent = 'Point camera at guest QR code';
      }).catch(err => {
        statusEl.textContent = 'Camera error — use manual input below';
        console.error(err);
      });
    }).catch(err => {
      statusEl.textContent = 'Camera unavailable — use manual input below';
      console.error(err);
    });
  }

  startScanner();

  async function processScan(ref) {
    try {
      const res  = await fetch('backend/scan_qr.php', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ ref, scannedBy: 'staff' })
      });
      const data = await res.json();
      showResult(data);
    } catch (err) {
      showResult({ success: false, message: 'Server error. Check connection.' });
    }
  }

  function processManual() {
    const ref = document.getElementById('manual-ref').value.trim();
    if (!ref) return;
    if (scanner) scanner.pause();
    processScan(ref);
  }

  function showResult(data) {
    const card = document.getElementById('result-card');
    card.className     = '';
    card.style.display = 'block';
    if (data.success) {
      card.classList.add(data.action === 'time_in' ? 'time-in' : 'time-out');
      document.getElementById('res-badge').textContent    = data.action === 'time_in' ? '✅ Checked In' : '🚪 Checked Out';
      document.getElementById('res-name').textContent     = data.guest;
      document.getElementById('res-ref').textContent      = data.ref;
      document.getElementById('res-time').textContent     = data.action === 'time_in'
        ? 'Time In: ' + new Date(data.time).toLocaleTimeString('en-PH')
        : 'In: ' + new Date(data.time_in).toLocaleTimeString('en-PH') + ' → Out: ' + new Date(data.time_out).toLocaleTimeString('en-PH');
      document.getElementById('res-duration').textContent = data.duration ? '⏱ ' + data.duration : '';
    } else {
      card.classList.add('error');
      document.getElementById('res-badge').textContent    = '❌ Error';
      document.getElementById('res-name').textContent     = data.message;
      document.getElementById('res-ref').textContent      = '';
      document.getElementById('res-time').textContent     = '';
      document.getElementById('res-duration').textContent = '';
    }
    statusEl.textContent = '';
  }

  function resetScanner() {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('manual-ref').value          = '';
    lastScanned = '';
    if (scanner) scanner.resume();
    statusEl.textContent = 'Point camera at guest QR code';
  }

  document.getElementById('manual-ref').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') processManual();
  });
</script>
</body>
</html>
